name: Build and Orca Container Image Scan

on:
  push:
    branches: ["main"]
  # Uncomment to enable PR scanning:
  # pull_request:
  #   branches: ["main"]
  # Uncomment for daily scheduled scan:
  # schedule:
  #   - cron: '0 0 * * *'

env:
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  PROJECT_KEY: srikantvinayak-Orca-Testing  # ← Replace with your Orca project key

jobs:
  build-and-scan:
    name: Build Image & Orca Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (enables advanced build features & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build the Docker image and load it into the local Docker daemon
      #    (NOT pushed to a registry — Orca will scan it locally)
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false        # Keep image local for scanning; push after scan passes
          load: true         # Load into local Docker daemon so Orca can access it
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Run Orca Security container image scan
      - name: Run Orca Container Image Scan
        uses: orcasecurity/shiftleft-container-image-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          image: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          output: "results/"
          # Optional: fail the workflow if issues above a severity are found
          # exit_code: "1"
          # severity: "high"

      # 5. Upload Orca scan results as a build artifact (always, even on failure)
      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        if: always()   # Ensures results are saved even if the scan step fails
        with:
          name: orca-scan-results-${{ github.sha }}
          path: results/
          retention-days: 30

      # 6. (Optional) Push to registry ONLY after a clean scan
      #    Uncomment and configure if you want gated pushes to a registry.
