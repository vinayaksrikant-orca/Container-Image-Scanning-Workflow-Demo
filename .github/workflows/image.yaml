name: Build and Orca Container Image Scan

on:
  push:
    branches: ["main"]
  # pull_request:
  #   branches: ["main"]
  # schedule:
  #   - cron: '0 0 * * *'

env:
  IMAGE_TAG: ${{ github.sha }}
  PROJECT_KEY: srikantvinayak-Orca-Testing

jobs:
  build-and-scan:
    name: Build Image & Orca Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Convert repo name to lowercase and store as an output variable
      - name: Set Lowercase Image Name
        id: image_name
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Orca Container Image Scan
        uses: orcasecurity/shiftleft-container-image-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          image: "${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}"
          output: "results/"

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orca-scan-results-${{ github.sha }}
          path: results/
          retention-days: 30

