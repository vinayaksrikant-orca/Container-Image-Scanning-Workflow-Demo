name: Build and Orca Container Image Scan

on:
  push:
    branches: ["main"]
  # pull_request:
  #   branches: ["main"]
  # schedule:
  #   - cron: '0 0 * * *'

env:
  IMAGE_TAG: ${{ github.sha }}
  PROJECT_KEY: srikantvinayak-Orca-Testing

jobs:
  build-and-scan:
    name: Build Image & Orca Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Step 1: Create a Dockerfile at the repo root if one doesn't exist
      - name: Create Dockerfile
        run: |
          cat <<'EOF' > Dockerfile
          FROM ubuntu:22.04

          LABEL maintainer="your-team@example.com"

          RUN apt-get update && apt-get install -y \
              curl \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          COPY . .

          CMD ["echo", "Hello from container"]
          EOF

      # ✅ Step 2: Convert repo name to lowercase for Docker compatibility
      - name: Set Lowercase Image Name
        id: image_name
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ✅ Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ Step 4: Build the Docker image locally (not pushed to registry)
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ✅ Step 5: Scan the built image with Orca Security
      - name: Run Orca Container Image Scan
        uses: orcasecurity/shiftleft-container-image-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          image: "${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}"
          output: "results/"

      # ✅ Step 6: Upload scan results as artifact (preserved even if scan fails)
      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orca-scan-results-${{ github.sha }}
          path: results/
          retention-days: 30

      # Optional: Push to registry only after a clean scan
      # - name: Log in to GitHub Container Registry
      #   if: success()
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #
