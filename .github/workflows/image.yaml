name: Build and Orca Container Image Scan

on:
  push:
    branches: ["main"]
  # pull_request:
  #   branches: ["main"]
  # schedule:
  #   - cron: '0 0 * * *'

env:
  IMAGE_TAG: ${{ github.sha }}
  PROJECT_KEY: srikantvinayak-Orca-Testing  # ✅ Updated project key

jobs:  
  build-and-scan:
    name: Build Image & Orca Scan
    runs-on: ubuntu-latest
    # ✅ Required permission for SARIF upload to GitHub Security tab
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Step 1: Create Dockerfile
      - name: Create Dockerfile
        run: |
          cat <<'EOF' > Dockerfile
          FROM ubuntu:22.04

          LABEL maintainer="your-team@example.com"

          RUN apt-get update && apt-get install -y \
              curl \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          COPY . .

          CMD ["echo", "Hello from container"]
          EOF

      # ✅ Step 2: Convert repo name to lowercase
      - name: Set Lowercase Image Name
        id: image_name
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ✅ Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ Step 4: Build Docker Image locally
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ✅ Step 5: Run Orca Scan — output both JSON and SARIF
      - name: Run Orca Container Image Scan
        uses: orcasecurity/shiftleft-container-image-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          image: "${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}"
          output: "results/"
          format: "json,sarif"   # ✅ Outputs both formats simultaneously

      # ✅ Step 6: Parse JSON and write rich summary to GitHub Actions UI
      - name: Publish Scan Summary to GitHub
        if: always()
        run: |
          JSON_FILE="results/image.json"

          if [ ! -f "$JSON_FILE" ]; then
            echo "⚠️ Scan results file not found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Parse counts
          TOTAL_VULNS=$(jq '.vulnerabilities_count.total' "$JSON_FILE")
          CRITICAL=$(jq '.vulnerabilities_count.critical' "$JSON_FILE")
          HIGH=$(jq '.vulnerabilities_count.high' "$JSON_FILE")
          MEDIUM=$(jq '.vulnerabilities_count.medium' "$JSON_FILE")
          LOW=$(jq '.vulnerabilities_count.low' "$JSON_FILE")
          SHOULD_FAIL=$(jq '.should_fail' "$JSON_FILE")
          RESULTS_URL=$(jq -r '.results_url' "$JSON_FILE")

          TOTAL_CONTROLS=$(jq '.controls_count.total' "$JSON_FILE")
          FAILED_CONTROLS=$(jq '.controls_count.failed' "$JSON_FILE")
          WARN_CONTROLS=$(jq '.controls_count.warning' "$JSON_FILE")
          PASSED_CONTROLS=$(jq '.controls_count.passed' "$JSON_FILE")

          # Overall status badge
          if [ "$SHOULD_FAIL" = "true" ]; then
            STATUS_BADGE="🔴 FAILED"
          else
            STATUS_BADGE="🟢 PASSED"
          fi

          # Write summary
          cat <<SUMMARY >> $GITHUB_STEP_SUMMARY
          # 🔍 Orca Security — Container Image Scan Results

          **Project:** \`${{ env.PROJECT_KEY }}\`
          **Image:** \`${{ steps.image_name.outputs.value }}:${{ env.IMAGE_TAG }}\`
          **Overall Status:** $STATUS_BADGE

          ---

          ## 🛡️ Vulnerability Summary

          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | $CRITICAL |
          | 🟠 High     | $HIGH |
          | 🟡 Medium   | $MEDIUM |
          | 🔵 Low      | $LOW |
          | **Total**   | **$TOTAL_VULNS** |

          ---

          ## 📋 Policy Controls Summary

          | Status  | Count |
          |---------|-------|
          | ❌ Failed  | $FAILED_CONTROLS |
          | ⚠️ Warning | $WARN_CONTROLS |
          | ✅ Passed  | $PASSED_CONTROLS |
          | **Total**  | **$TOTAL_CONTROLS** |

          ---

          ## 📑 Policy Results

          SUMMARY

          # Append each policy result
          jq -r '.policies_summary[] | "| \(.policy_name) | \(if .failed then "❌ Failed" else "✅ Passed" end) |"' "$JSON_FILE" >> $GITHUB_STEP_SUMMARY

          cat <<SUMMARY >> $GITHUB_STEP_SUMMARY

          ---

          ## 🏥 Best Practice Findings

          | Check | Priority | Status |
          |-------|----------|--------|
          SUMMARY

          jq -r '.results.container_image_best_practices.results[] | "| \(.catalog_control.title) | \(.priority) | \(if .status == "FAILED" then "❌ FAILED" elif .status == "WARNING" then "⚠️ WARNING" else "✅ PASSED" end) |"' "$JSON_FILE" >> $GITHUB_STEP_SUMMARY

          cat <<SUMMARY >> $GITHUB_STEP_SUMMARY

          ---

          🔗 [**View Full Scan Report in Orca →**]($RESULTS_URL)
          SUMMARY

      # ✅ Step 7: Upload SARIF to GitHub Security → Code Scanning tab
      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results/image.sarif

      # ✅ Step 8: Upload raw results as downloadable artifact
      - name: Upload Scan Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orca-scan-results-${{ github.sha }}
          path: results/
          retention-days: 30
